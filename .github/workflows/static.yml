name: Build and test extension

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and unit tests
        run: npm test

      - name: Build loadable extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run unpacked extension smoke tests
        run: npm run test:smoke

      - name: Package extension artifact
        run: cd dist && zip -r ../browser-os-new-tab.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-os-new-tab
          path: browser-os-new-tab.zip
          if-no-files-found: error
